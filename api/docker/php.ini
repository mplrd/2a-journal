upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 256M
max_execution_time = 60

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; TRANSITOIRE - PHP2Shell (CVE-2026-109618 / CVE-2026-109619), 2026-10-21.
; Parade en attendant que l'image officielle php:8.4.27-cli soit publiee sur
; Docker Hub (tag cree mais sans image ce jour, php:8.4-cli encore en 8.4.26).
; Une fois l'image dispo : passer le FROM de api/Dockerfile en php:8.4.27-cli
; minimum, puis retirer cette ligne.
; Sans impact fonctionnel : l'API n'utilise pas les sessions PHP (auth JWT).
session.upload_progress.enabled = Off
